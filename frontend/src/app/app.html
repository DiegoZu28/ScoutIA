<div class="min-h-screen bg-slate-50 dark:bg-slate-950">
  <nav class="border-b border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
    <div class="mx-auto flex max-w-3xl items-center gap-6 px-4 py-3">
      <a routerLink="/" title="Ir a la pantalla de bienvenida">
        <img src="logo.png" alt="ScoutIA" class="h-9 w-9" />
      </a>
      <div class="flex flex-1 gap-4 text-sm text-slate-400 dark:text-slate-500">
        <a
          routerLink="/"
          routerLinkActive="font-medium text-slate-900 dark:text-slate-100"
          [routerLinkActiveOptions]="{ exact: true }"
          >Inicio</a
        >
        <a routerLink="/jugador" routerLinkActive="font-medium text-slate-900 dark:text-slate-100"
          >Buscar jugador</a
        >
        <a routerLink="/comparar" routerLinkActive="font-medium text-slate-900 dark:text-slate-100"
          >Comparador</a
        >
        <a routerLink="/oportunidades" routerLinkActive="font-medium text-slate-900 dark:text-slate-100"
          >Oportunidades</a
        >
      </div>

      <button
        type="button"
        (click)="temaServicio.alternar()"
        class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100"
        [attr.aria-label]="temaServicio.tema() === 'oscuro' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        title="Alternar modo claro/oscuro"
      >
        @if (temaServicio.tema() === 'oscuro') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
            <circle cx="12" cy="12" r="4" />
            <path
              stroke-linecap="round"
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
            <path d="M20.354 15.354A9 9 0 0 1 8.646 3.646 9.003 9.003 0 1 0 20.354 15.354Z" />
          </svg>
        }
      </button>
    </div>
  </nav>

  <router-outlet />
</div>
