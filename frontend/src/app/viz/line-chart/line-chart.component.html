<svg [attr.viewBox]="'0 0 ' + ancho + ' ' + alto" class="w-full">
  @for (linea of lineasGuia(); track linea.valor) {
    <line
      [attr.x1]="ejeXY"
      [attr.y1]="linea.y"
      [attr.x2]="ejeXAncho"
      [attr.y2]="linea.y"
      class="stroke-slate-200 dark:stroke-slate-700"
      stroke-width="1"
    />
    <text [attr.x]="ejeXY - 8" [attr.y]="linea.y" text-anchor="end" dominant-baseline="middle" font-size="12" class="fill-slate-500 dark:fill-slate-400">
      {{ formatoValor()(linea.valor) }}
    </text>
  }

  <path [attr.d]="lineaPath()" fill="none" [attr.stroke]="colorLinea()" stroke-width="2.5" />

  @for (p of puntosSvg(); track p.etiqueta) {
    <circle [attr.cx]="p.x" [attr.cy]="p.y" r="4.5" [attr.fill]="colorLinea()" />
    <text [attr.x]="p.x" [attr.y]="ejeXAlto + 20" text-anchor="middle" font-size="12" class="fill-slate-500 dark:fill-slate-400">
      {{ p.etiqueta }}
    </text>
    <text [attr.x]="p.x" [attr.y]="p.y - 12" text-anchor="middle" font-size="13.5" font-weight="600" class="fill-slate-800 dark:fill-slate-200">
      {{ formatoValor()(p.valor) }}
    </text>
  }
</svg>
