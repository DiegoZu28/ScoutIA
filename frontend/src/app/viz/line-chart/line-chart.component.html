<svg [attr.viewBox]="'0 0 ' + ancho + ' ' + alto" class="w-full">
  @for (linea of lineasGuia(); track linea.valor) {
    <line
      [attr.x1]="ejeXY"
      [attr.y1]="linea.y"
      [attr.x2]="ejeXAncho"
      [attr.y2]="linea.y"
      stroke="#e2e8f0"
      stroke-width="1"
    />
    <text [attr.x]="ejeXY - 6" [attr.y]="linea.y" text-anchor="end" dominant-baseline="middle" font-size="9" class="fill-slate-500">
      {{ formatoValor()(linea.valor) }}
    </text>
  }

  <path [attr.d]="lineaPath()" fill="none" [attr.stroke]="colorLinea()" stroke-width="2" />

  @for (p of puntosSvg(); track p.etiqueta) {
    <circle [attr.cx]="p.x" [attr.cy]="p.y" r="3.5" [attr.fill]="colorLinea()" />
    <text [attr.x]="p.x" [attr.y]="ejeXAlto + 14" text-anchor="middle" font-size="9" class="fill-slate-500">
      {{ p.etiqueta }}
    </text>
    <text [attr.x]="p.x" [attr.y]="p.y - 8" text-anchor="middle" font-size="9" class="fill-slate-700 font-medium">
      {{ formatoValor()(p.valor) }}
    </text>
  }
</svg>
