<svg [attr.viewBox]="'0 0 ' + size() + ' ' + size()" class="mx-auto w-full max-w-xs">
  @for (fraccion of anillos; track fraccion) {
    <polygon [attr.points]="anilloPath(fraccion)" fill="none" stroke="#e2e8f0" stroke-width="1" />
  }

  @for (eje of ejes(); track eje.etiqueta) {
    <line
      [attr.x1]="centroValor"
      [attr.y1]="centroValor"
      [attr.x2]="lineaEjeX2(eje)"
      [attr.y2]="lineaEjeY2(eje)"
      stroke="#e2e8f0"
      stroke-width="1"
    />
    <text
      [attr.x]="etiquetaX(eje)"
      [attr.y]="etiquetaY(eje)"
      text-anchor="middle"
      dominant-baseline="middle"
      font-size="9"
      class="fill-slate-500"
    >
      {{ eje.etiqueta }}
    </text>
  }

  @for (serie of series(); track serie.etiqueta) {
    <polygon
      [attr.points]="poligonoPath(serie)"
      [attr.fill]="serie.color + '2e'"
      [attr.stroke]="serie.color"
      stroke-width="2"
    />
  }
</svg>

@if (series().length > 1) {
  <div class="mt-2 flex flex-wrap justify-center gap-x-4 gap-y-1">
    @for (serie of series(); track serie.etiqueta) {
      <span class="flex items-center gap-1.5 text-xs text-slate-600">
        <span class="h-2.5 w-2.5 rounded-full" [style.background-color]="serie.color"></span>
        {{ serie.etiqueta }}
      </span>
    }
  </div>
}
