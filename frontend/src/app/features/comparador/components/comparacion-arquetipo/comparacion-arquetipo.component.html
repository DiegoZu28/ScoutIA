<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
  <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wide dark:text-slate-400">Arquetipo de estilo de juego</h3>

  <div class="mt-2 flex flex-wrap items-center gap-2">
    <span
      class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-3 py-1 text-sm font-medium text-slate-800 dark:bg-slate-700 dark:text-slate-200"
    >
      <span class="h-2.5 w-2.5 rounded-full" [style.background-color]="colorA"></span>
      {{ nombreA() }}: {{ arquetipo().etiqueta_a }}
    </span>
    <span
      class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-3 py-1 text-sm font-medium text-slate-800 dark:bg-slate-700 dark:text-slate-200"
    >
      <span class="h-2.5 w-2.5 rounded-full" [style.background-color]="colorB"></span>
      {{ nombreB() }}: {{ arquetipo().etiqueta_b }}
    </span>
  </div>

  <p
    class="mt-3 text-xs"
    [class.text-emerald-700]="arquetipo().mismo_arquetipo"
    [class.text-slate-500]="!arquetipo().mismo_arquetipo"
    [class.dark:text-emerald-400]="arquetipo().mismo_arquetipo"
    [class.dark:text-slate-400]="!arquetipo().mismo_arquetipo"
  >
    {{
      arquetipo().mismo_arquetipo
        ? 'Mismo arquetipo: ambos tienen un estilo de juego similar.'
        : 'Arquetipos distintos: tienen estilos de juego diferentes.'
    }}
  </p>
</div>
