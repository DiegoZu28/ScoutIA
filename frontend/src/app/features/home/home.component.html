<div class="mx-auto max-w-3xl px-4 py-8">
  <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">ScoutIA</h1>
  <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">
    Busca un jugador de las 5 grandes ligas europeas para ver su ficha, valor estimado y cómo
    se compara con otros jugadores.
  </p>

  <div class="mt-6">
    <app-buscador-jugador (jugadorSeleccionado)="onJugadorSeleccionado($event)" />
  </div>

  <div class="mt-6">
    @if (playerId(); as id) {
      <app-ficha-jugador [playerId]="id" />
    } @else {
      <p class="text-sm text-slate-400 dark:text-slate-500">Ningún jugador seleccionado todavía.</p>
    }
  </div>
</div>
