<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
  <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wide">
    Percentiles por posición y temporada
  </h3>
  <p class="mt-1 text-xs text-slate-500">
    Comparado contra {{ percentiles().grupo_comparacion.n }} jugadores en la posición
    "{{ percentiles().grupo_comparacion.posicion }}" en {{ percentiles().grupo_comparacion.temporada }}.
  </p>

  <app-radar-chart [puntos]="puntos()" />
</div>
