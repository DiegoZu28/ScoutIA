<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
  <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wide dark:text-slate-400">
    Comparación con otros jugadores de su posición
  </h3>
  <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">
    Cada estadística muestra a cuántos de los {{ percentiles().grupo_comparacion.n }} jugadores en la
    posición "{{ percentiles().grupo_comparacion.posicion }}" en
    {{ percentiles().grupo_comparacion.temporada }} supera.
  </p>

  <app-radar-chart [series]="series()" />
</div>
