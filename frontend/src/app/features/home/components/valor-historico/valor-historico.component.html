<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
  <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wide dark:text-slate-400">
    Valor de mercado por temporada
  </h3>
  <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">Valor observado (Transfermarkt), no la estimación del modelo.</p>

  <div class="mt-3">
    <app-line-chart [puntos]="puntos()" colorLinea="#c92a2a" [formatoValor]="formatoCompacto" />
  </div>
</div>
