<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
  <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wide dark:text-slate-400">
    Rendimiento por temporada
  </h3>

  <div class="mt-2 flex flex-wrap gap-1.5">
    @for (opcion of opciones; track opcion.clave) {
      <button
        type="button"
        (click)="elegir(opcion.clave)"
        class="rounded-full px-3 py-1 text-xs font-medium transition"
        [class.bg-slate-900]="statSeleccionado() === opcion.clave"
        [class.text-white]="statSeleccionado() === opcion.clave"
        [class.dark:bg-slate-100]="statSeleccionado() === opcion.clave"
        [class.dark:text-slate-900]="statSeleccionado() === opcion.clave"
        [class.bg-slate-100]="statSeleccionado() !== opcion.clave"
        [class.text-slate-600]="statSeleccionado() !== opcion.clave"
        [class.dark:bg-slate-700]="statSeleccionado() !== opcion.clave"
        [class.dark:text-slate-300]="statSeleccionado() !== opcion.clave"
      >
        {{ opcion.etiqueta }}
      </button>
    }
  </div>

  <div class="mt-3">
    <app-line-chart
      [puntos]="puntos()"
      [colorLinea]="opcionActual().color"
      [formatoValor]="formatoEntero"
    />
  </div>
</div>
