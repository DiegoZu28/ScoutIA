[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Diego Zuniga", email = "diegoanzugal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "joblib==1.5.3",
    "numpy==2.5.2",
    "openai>=3.14.1",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn==1.9.0",
    "shap==0.52.0",
    "unidecode>=1.4.0",
    "uvicorn[standard]>=0.52.4",
    "xgboost==3.4.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
